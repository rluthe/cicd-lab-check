# Continuous integration: runs the tests on every pull request to main
# and on every push to main. The job name "test" is the status check
# you will require in your repository ruleset (laboratory step C.4).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the tests
        run: npm test
